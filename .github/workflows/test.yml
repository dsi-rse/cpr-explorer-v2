# runs every nectr fixture query through src/utils/queries.ts against the data on R2,
# and checks the DuckDB-WASM runtime for the pinned package version is on the bucket
name: Query parity

on:
  pull_request:
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        # pinned: pnpm 9 (Workers Builds), 10 and 11 all install this repo, but treat build scripts differently
        run: npm install -g pnpm@10 && pnpm install --frozen-lockfile

      - name: Check DuckDB runtime on R2
        run: pnpm exec tsx scripts/duckdb-runtime.ts check

      - name: Run Parity
        run: pnpm parity
        env:
          VITE_DATA_URL: ${{ vars.VITE_DATA_URL }}
