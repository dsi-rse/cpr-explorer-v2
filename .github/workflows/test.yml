# runs every nectr fixture query through src/utils/queries.ts against the data on R2
name: Query parity

on:
  pull_request:
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install -g pnpm && pnpm install --frozen-lockfile

      - name: Run Parity
        run: pnpm parity
        env:
          VITE_DATA_URL: ${{ vars.VITE_DATA_URL }}
